<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>疯狂地毯 · 试玩预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #34251f; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    #phone { width: min(100vw, 430px); height: min(100vh, 860px); overflow: hidden; background: #fff4df; box-shadow: 0 18px 60px #0008; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    @media (max-width: 430px) { #phone { width: 100vw; height: 100vh; } }
  </style>
</head>
<body>
  <main id="phone" aria-label="疯狂地毯游戏预览"></main>
  <script>
    const host = document.querySelector('#phone');
    const touchHandlers = {};
    window.wx = {
      getSystemInfoSync() { return { windowWidth: host.clientWidth || 390, windowHeight: host.clientHeight || 780, pixelRatio: 1 }; },
      createImage() { return new Image(); },
      createCanvas() {
        const canvas = document.createElement('canvas');
        host.appendChild(canvas);
        ['start', 'move', 'end'].forEach(type => canvas.addEventListener('touch' + type, event => {
          event.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const source = type === 'end' ? event.changedTouches[0] : event.touches[0];
          const touch = source && { clientX: source.clientX - rect.left, clientY: source.clientY - rect.top };
          touchHandlers[type] && touchHandlers[type]({ touches: touch ? [touch] : [], changedTouches: touch ? [touch] : [] });
        }, { passive: false }));
        canvas.addEventListener('mousedown', event => { touchHandlers.start && touchHandlers.start({ touches: [{ clientX: event.offsetX, clientY: event.offsetY }] }); });
        canvas.addEventListener('mousemove', event => { if (event.buttons) touchHandlers.move && touchHandlers.move({ touches: [{ clientX: event.offsetX, clientY: event.offsetY }] }); });
        canvas.addEventListener('mouseup', event => { touchHandlers.end && touchHandlers.end({ changedTouches: [{ clientX: event.offsetX, clientY: event.offsetY }] }); });
        return canvas;
      },
      onTouchStart(fn) { touchHandlers.start = fn; }, onTouchMove(fn) { touchHandlers.move = fn; }, onTouchEnd(fn) { touchHandlers.end = fn; },
      getStorageSync(key) { try { return JSON.parse(localStorage.getItem('crazy-carpet-' + key)); } catch (_) { return null; } },
      setStorageSync(key, value) { localStorage.setItem('crazy-carpet-' + key, JSON.stringify(value)); },
      vibrateShort() {}
    };
  </script>
  <script src="game.js"></script>
</body>
</html>
